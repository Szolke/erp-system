[supervisord]
nodaemon=true
; A konténer `sail`-ként indul, ezért a supervisord sem rootként fut. Az azonos
; uid-ra mutató `user=` a supervisordban szándékos no-op, viszont ha a konténert
; valaki mégis rootként indítja (`user: root` a compose-ban), ez a sor dobja le a
; jogosultságot -- így mindkét esetben `sail` a végeredmény.
user=sail
logfile=/var/log/supervisor/supervisord.log
; A /var/run rootnak van fenntartva; nem-root supervisord ide nem tud pidfile-t írni.
pidfile=/tmp/supervisord.pid

[program:php]
command=%(ENV_SUPERVISOR_PHP_COMMAND)s
user=%(ENV_SUPERVISOR_PHP_USER)s
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-worker]
command=php /var/www/html/artisan queue:work --tries=3 --backoff=300 --sleep=3
user=%(ENV_SUPERVISOR_PHP_USER)s
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
stopwaitsecs=3600

[program:scheduler]
command=php /var/www/html/artisan schedule:work
user=%(ENV_SUPERVISOR_PHP_USER)s
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
